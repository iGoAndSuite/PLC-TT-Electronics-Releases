name: Publish verified binary
on:
  push:
    branches: ['incoming-*']
permissions:
  contents: write
concurrency:
  group: publish-binaries
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1
      - name: Verify manifest, upload allowlisted assets, publish, remove transport branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, re, urllib.request
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          repository = 'iGoAndSuite/PLC-TT-Electronics-Releases'
          if os.environ['GITHUB_REPOSITORY'] != repository:
              raise RuntimeError('Unexpected repository')
          folder = pathlib.Path('incoming')
          raw = (folder / 'manifest.json').read_bytes()
          signature = (folder / 'manifest.sig').read_bytes()
          if len(raw) > 16384 or len(signature) > 256:
              raise RuntimeError('Oversized manifest')
          public = bytes.fromhex('fce9baa270066eafbfce1ca5136aeacb12786d0190268d618f7d7524de4c9195')
          Ed25519PublicKey.from_public_bytes(public).verify(base64.b64decode(signature, validate=True), raw)
          manifest = json.loads(raw)
          tag = manifest['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', tag) or os.environ['GITHUB_REF_NAME'] != 'incoming-' + tag:
              raise RuntimeError('Invalid version/branch')
          if manifest.get('schema') != 1 or manifest.get('repository') != repository:
              raise RuntimeError('Wrong product')
          filename = 'IgoAndSeePLC-' + tag + '.msi'
          if manifest['filename'] != filename:
              raise RuntimeError('Invalid MSI name')
          package = folder / filename
          if package.stat().st_size != manifest['size'] or package.stat().st_size >= 100_000_000:
              raise RuntimeError('Invalid MSI size')
          if hashlib.sha256(package.read_bytes()).hexdigest() != manifest['sha256']:
              raise RuntimeError('Modified MSI')
          base = 'https://api.github.com/repos/' + repository
          def request(url, data=None, method=None, binary=False):
              body = data if binary else json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/octet-stream' if binary else 'application/json', 'User-Agent': 'PLC-release'})
              with urllib.request.urlopen(req, timeout=180) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None
          latest = request(base + '/releases?per_page=100')
          def version(value):
              return tuple(map(int, value.split('.')))
          for release in latest:
              other = release['tag_name']
              if re.fullmatch(r'\d+\.\d+\.\d+', other) and version(other) >= version(tag):
                  raise RuntimeError('Version already published or superseded; no overwrite')
          release = request(base + '/releases', {'tag_name': tag, 'target_commitish': 'main',
              'name': 'IgoAndTrack Desktop ' + tag, 'draft': True, 'prerelease': False,
              'body': 'Windows x64. Actualizaciones verificadas con Ed25519. MSI sin certificado Authenticode.'})
          upload = release['upload_url'].split('{')[0]
          if upload != f'https://uploads.github.com/repos/{repository}/releases/{release["id"]}/assets':
              raise RuntimeError('Unexpected upload endpoint')
          for path in (package, folder / 'manifest.json', folder / 'manifest.sig'):
              content = path.read_bytes()
              asset = request(upload + '?name=' + path.name, content, binary=True)
              if asset.get('digest') != 'sha256:' + hashlib.sha256(content).hexdigest():
                  raise RuntimeError('Upload verification failed; draft retained')
          request(base + '/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'}, method='PATCH')
          request(base + '/git/refs/heads/incoming-' + tag, method='DELETE')
          print('Published verified release ' + tag + '; temporary delivery branch removed.')
